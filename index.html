<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Status bar style "black": the app starts below a solid black status
         bar. "black-translucent" draws under it, but iOS then stops painting
         the app 62pt above the bottom edge of home-screen apps.
         viewport-fit=cover still gives env(safe-area-inset-bottom) for the
         home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="JellyJet" />
    <meta name="description" content="A music client for Jellyfin." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/Archivo-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Archivo-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Archivo-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html, body { background-color: #0a0a0b; }
    </style>
    <title>JellyJet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
