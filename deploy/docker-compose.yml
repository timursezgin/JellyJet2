# JellyJet 2 on tim-box (Desktop\JellyJet2). Start or restart it from that
# folder with:
#   docker compose up -d
# The app itself is the ./site folder, which `npm run deploy` refreshes - new
# versions show up without restarting anything.
services:
  jellyjet2:
    image: caddy:2-alpine
    container_name: JellyJet2
    restart: unless-stopped
    ports:
      # The Cloudflare tunnel's jj.timursezgin.work route points at this port.
      - "8091:8080"
    environment:
      # Jellyfin and the download orchestrator, as reached from this container.
      - JELLYFIN_UPSTREAM=host.docker.internal:8096
      - PIPELINE_UPSTREAM=host.docker.internal:8420
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
